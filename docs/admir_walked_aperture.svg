<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <style>
    .title{font:700 29px Arial,sans-serif;fill:#16243a}.h{font:700 20px Arial,sans-serif;fill:#16243a}.t{font:17px Arial,sans-serif;fill:#34445a}.s{font:14px Arial,sans-serif;fill:#4a5a70}.n{font:700 14px Arial,sans-serif;fill:#fff}.eq{font:700 20px Arial,sans-serif;fill:#075985}
  </style>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <text x="60" y="55" class="title">ADMIRE: elementos del transductor y líneas de imagen</text>
  <text x="60" y="84" class="t">Esquema reducido para visualizar la lógica. El ejemplo real usa 128 elementos, una apertura de 65 y 64 líneas.</text>

  <text x="60" y="145" class="h">1. Transductor físico</text>
  <text x="60" y="173" class="t">Tiene N total elementos. En ADMIRE: N total = 128.</text>
  <g transform="translate(60 198)">
    <rect x="0" y="0" width="900" height="72" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <g fill="#2563eb" stroke="#173f83" stroke-width="1">
      <rect x="25" y="14" width="50" height="44"/><rect x="95" y="14" width="50" height="44"/><rect x="165" y="14" width="50" height="44"/><rect x="235" y="14" width="50" height="44"/>
      <rect x="305" y="14" width="50" height="44"/><rect x="375" y="14" width="50" height="44"/><rect x="445" y="14" width="50" height="44"/><rect x="515" y="14" width="50" height="44"/>
      <rect x="585" y="14" width="50" height="44"/><rect x="655" y="14" width="50" height="44"/><rect x="725" y="14" width="50" height="44"/><rect x="795" y="14" width="50" height="44"/>
    </g>
    <g class="n"><text x="45" y="42">1</text><text x="115" y="42">2</text><text x="185" y="42">3</text><text x="255" y="42">4</text><text x="325" y="42">5</text><text x="395" y="42">6</text><text x="465" y="42">7</text><text x="535" y="42">8</text><text x="605" y="42">9</text><text x="670" y="42">10</text><text x="740" y="42">11</text><text x="810" y="42">12</text></g>
  </g>
  <text x="980" y="237" class="s">12 dibujados</text><text x="980" y="258" class="s">para explicar</text>

  <text x="60" y="330" class="h">2. Una línea no es un elemento</text>
  <text x="60" y="358" class="t">Una línea es una adquisición que usa una ventana de elementos activos. Esa adquisición produce una columna de la imagen.</text>
  <g transform="translate(60 385)">
    <text x="0" y="23" class="t">Línea 1</text><rect x="125" y="0" width="360" height="44" rx="6" fill="#0f766e"/><text x="505" y="29" class="s">activa 1–8</text>
    <text x="0" y="83" class="t">Línea 2</text><rect x="170" y="60" width="360" height="44" rx="6" fill="#0f766e"/><text x="550" y="89" class="s">activa 2–9</text>
    <text x="0" y="143" class="t">Línea 3</text><rect x="215" y="120" width="360" height="44" rx="6" fill="#0f766e"/><text x="595" y="149" class="s">activa 3–10</text>
    <text x="0" y="203" class="t">…</text><rect x="260" y="180" width="360" height="44" rx="6" fill="#0f766e"/><text x="640" y="209" class="s">la ventana avanza</text>
    <text x="0" y="263" class="t">Línea 5</text><rect x="305" y="240" width="360" height="44" rx="6" fill="#0f766e"/><text x="685" y="269" class="s">activa 5–12</text>
  </g>
  <path d="M105 432 L105 612" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="760" y="427" class="h">Ejemplo real ADMIRE</text>
  <text x="760" y="463" class="eq">128 − 65 + 1 = 64 líneas</text>
  <text x="760" y="499" class="t">Cada línea desplaza la apertura</text>
  <text x="760" y="524" class="t">un elemento físico hacia la derecha.</text>
  <text x="760" y="574" class="t">65: elementos Tx y Rx procesados</text>
  <text x="760" y="600" class="t">128: elementos físicos disponibles</text>
  <text x="760" y="626" class="t">64: columnas laterales de la imagen</text>
</svg>
